name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -m "not live"

      # ruff kommt aus der `dev`-Extra und ist dort hart gepinnt. Kein
      # zweiter `pip install ruff==…` an dieser Stelle: der waere ein zweiter
      # Pin, der mit pyproject.toml uebereinstimmen muesste, und genau daran
      # lief es vorher auseinander — die CI war gepinnt, der lokale
      # Dev-Install nicht.
      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
